# Catppuccin Mocha (Dark) Theme Configuration
# This file is loaded when system is in dark mode

set -g @catppuccin_flavor 'mocha'

# Unset palette colors (set with -o on first load, must be cleared for flavor switch)
set -gu @thm_bg
set -gu @thm_fg
set -gu @thm_rosewater
set -gu @thm_flamingo
set -gu @thm_pink
set -gu @thm_mauve
set -gu @thm_red
set -gu @thm_maroon
set -gu @thm_peach
set -gu @thm_yellow
set -gu @thm_green
set -gu @thm_teal
set -gu @thm_sky
set -gu @thm_sapphire
set -gu @thm_blue
set -gu @thm_lavender
set -gu @thm_subtext_1
set -gu @thm_subtext_0
set -gu @thm_overlay_2
set -gu @thm_overlay_1
set -gu @thm_overlay_0
set -gu @thm_surface_2
set -gu @thm_surface_1
set -gu @thm_surface_0
set -gu @thm_mantle
set -gu @thm_crust

# Unset per-module options (also set with -o, not covered by palette reset)
set -gu @catppuccin_directory_color
set -gu @catppuccin_status_directory_icon_fg
set -gu @catppuccin_status_directory_text_fg
set -gu @catppuccin_status_directory_icon_bg
set -gu @catppuccin_session_color
set -gu @catppuccin_status_session_icon_fg
set -gu @catppuccin_status_session_text_fg
set -gu @catppuccin_status_session_icon_bg

run-shell '~/.config/tmux/plugins/tmux/catppuccin.tmux'
set -g status-style 'bg=default'

# catppuccin sets bell/activity styles with a solid bg (catppuccin_tmux.conf:169-170).
# A bg=default in a format inherits the BASE style's bg, not the terminal's - so that
# solid bg shows through the rounded caps and haloes the whole pill. The window-status
# formats below colour every segment explicitly, so keep these two neutral.
set -g window-status-bell-style "default"
set -g window-status-activity-style "default"

# Prompt input must track the prompt label; catppuccin's align=centre splits them
set -gF message-style "fg=#{@thm_teal},bg=default,align=left"
set -gF message-command-style "fg=#{@thm_teal},bg=default,align=left"

# Claude Code tab states, hoisted into vars so the two format strings below stay
# identical across flavours. green = working, blue = finished/unread. Text is
# @thm_crust on both: mocha accents are light, so dark text wins (busy 12.61:1,
# bell 8.91:1). Latte inverts this and needs darkened hexes - see that file.
set -gF @claude_busy_bg "#{@thm_green}"
set -gF @claude_bell_bg "#{@thm_blue}"

# Busy/bell recolour the name block only; the #I badge keeps its accent in every state.
# Busy is checked first so a tab that finished and is working again reads as working
# rather than as a stale unread notification. Both lines are identical across flavours -
# only the two colour vars above differ.
set -g window-status-format "#[fg=#{@thm_overlay_2},bg=default]#[fg=#{@thm_crust},bg=#{@thm_overlay_2}]#I #[fg=#{?#{E:@claude_busy},#{@thm_crust},#{?window_bell_flag,#{@thm_crust},#{@thm_fg}}},bg=#{?#{E:@claude_busy},#{@claude_busy_bg},#{?window_bell_flag,#{@claude_bell_bg},#{@thm_surface_0}}}] #W#[fg=#{?#{E:@claude_busy},#{@claude_busy_bg},#{?window_bell_flag,#{@claude_bell_bg},#{@thm_surface_0}}},bg=default]"
set -g window-status-current-format "#[fg=#{@thm_mauve},bg=default]#[fg=#{@thm_crust},bg=#{@thm_mauve}]#I #[fg=#{?#{E:@claude_busy},#{@thm_crust},#{@thm_fg}},bg=#{?#{E:@claude_busy},#{@claude_busy_bg},#{@thm_surface_1}}] #W#{?window_zoomed_flag,(_),}#[fg=#{?#{E:@claude_busy},#{@claude_busy_bg},#{@thm_surface_1}},bg=default]"
