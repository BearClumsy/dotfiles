# First remove *all* keybindings
# unbind-key -a
# Now reinsert all the regular tmux keys
bind ^X lock-server
bind ^C new-window -c "$HOME"
bind ^D detach
bind * list-clients

bind H previous-window
bind L next-window

# Move the current window (tab) left / right in the tab bar
bind -r S-Left  run-shell '~/.config/tmux/move-window.sh left  #{window_index} #{session_windows}'
bind -r S-Right run-shell '~/.config/tmux/move-window.sh right #{window_index} #{session_windows}'

# Drag a tab onto another tab to move it there (mouse-down already focused it).
# Drops outside the tabs fire MouseDragEnd1StatusRight/Pane and are ignored.
bind -n MouseDrag1Status { }
bind -n MouseDragEnd1Status run-shell -t = '~/.config/tmux/drag-window.sh #{active_window_index} #{window_index}'

# Name the active PANE, not the window: splits share one window name, so the tab
# reads @pane_name of whichever pane is focused (see themes/). Empty input clears it
# and the tab falls back to the automatic window name.
bind r command-prompt -I "#{?#{@pane_name},#{@pane_name},#W}" "set -p @pane_name '%%'"
bind R source-file ~/.config/tmux/tmux.conf
bind ^A last-window
bind ^W list-windows
bind w list-windows
bind z resize-pane -Z
bind ^L refresh-client
bind l refresh-client
bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind J command-prompt -p "join pane from window:" "join-pane -h -s '%%'"
bind '"' choose-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind c kill-pane
bind x swap-pane -D
bind S choose-session
bind n command-prompt -p "new session:" "new-session -s '%%' -c '$HOME'"
bind R source-file ~/.config/tmux/tmux.conf
bind K send-keys "clear"\; send-keys "Enter"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind f run-shell -b '~/.config/tmux/scratch-popup.sh open "#{client_name}"'
