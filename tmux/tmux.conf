# --- Initialization ---
source-file ~/.config/tmux/tmux.reset.conf

# Terminal color support
set-option -g default-terminal "tmux-256color"
set-option -g terminal-overrides ',xterm-256color:RGB'

# --- General Preferences ---
set -g prefix ^A
set -g base-index 1
set -g detach-on-destroy off
set-hook -g session-created 'if-shell "[ #{session_name} = scratch ]" "set-option -t scratch detach-on-destroy on"'
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
setw -g mode-keys vi
set -g mouse on
set -g aggressive-resize off

# Pane styling
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# --- Plugin List ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

# --- Catppuccin Appearance (Shared Settings) ---
set -g @catppuccin_flavor 'mocha' # Initial fallback
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #{?#{@pane_name},#{@pane_name},#W}"
set -g @catppuccin_window_current_text " #{?#{@pane_name},#{@pane_name},#W}#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_directory_text "#{=/20/…:#{b:pane_current_path}}"

# --- Claude Code tab integration ---
# The bell still rings (for the terminal's own attention cue), but the tab colours no
# longer read #{window_bell_flag}: it is window-wide, and tabs follow the focused pane.
# The colours themselves live in the per-flavor window-status-format in themes/.
# Don't set window-status-bell-style here: this runs before TPM, and catppuccin.tmux
# overwrites it on every theme switch anyway.
set -g monitor-bell on

# ~/.local/bin/claude symlinks to ~/.local/share/claude/versions/<version>, so the
# executable's basename *is* the version and #{pane_current_command} reports "2.1.241".
# Rewrite a bare N.N.N command to "claude"; everything else keeps tmux's default naming.
# Pi runs as "node", so pi-tmux-notify.ts marks its pane with @pi_pane. The node check
# stops a Pi that was killed without cleanup from naming the shell left behind.
# Single-quoted so tmux does not eat the regex backslashes.
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{&&:#{@pi_pane},#{==:#{pane_current_command},node}},Pi,#{s|^[0-9]+\.[0-9]+\.[0-9]+$|claude|:pane_current_command}}}#{?pane_dead,[dead],}'

# claude-notify.sh keeps per-PANE flags: @claude_pane_busy (green), @claude_pane_done
# (blue, finished but unseen) and @claude_pane_failed (red, a watched shell command
# failed). Like the tab name (#W, from the active pane via automatic-rename), the tab
# colour follows the window's ACTIVE pane: a Claude split beside a running make shows
# whichever has focus. #{P:} iterates the panes of the window being rendered (not the
# current one) and pane_active picks the focused one. Flavour-independent, so these
# live here rather than in themes/; the themes read them through #{E:} - a bare
# #{@claude_busy} yields this string verbatim instead of evaluating it.
set -g @claude_busy '#{?#{==:#{P:#{?pane_active,#{@claude_pane_busy},}},1},1,0}'
set -g @claude_done '#{?#{==:#{P:#{?pane_active,#{@claude_pane_done},}},1},1,0}'
set -g @claude_failed '#{?#{==:#{P:#{?pane_active,#{@claude_pane_failed},}},1},1,0}'

# Done/failed are user options, so nothing clears them on sight the way tmux clears a
# bell. These hooks do: whenever a pane may have become visible, clear-seen.sh drops
# its flags. #{pane_id} is the hook target's active pane.
set-hook -g session-window-changed 'run-shell -b "~/.config/tmux/clear-seen.sh #{pane_id}"'
set-hook -g client-session-changed 'run-shell -b "~/.config/tmux/clear-seen.sh #{pane_id}"'
set-hook -g window-pane-changed 'run-shell -b "~/.config/tmux/clear-seen.sh #{pane_id}"'

# scratch only shows as a popup (prefix + f): a main client that lands in it is sent
# back and gets the popup. -ga appends after the clear-seen hook, which the -g above
# resets first, so reloading does not pile up entries.
set-hook -ga client-session-changed 'run-shell -b "~/.config/tmux/scratch-popup.sh redirect \"#{hook_client}\""'

# --- Initialize TPM ---
run '~/.config/tmux/plugins/tpm/tpm'

# --- Status Bar Refresh (Runs after TPM) ---
set -g status-style 'bg=default'
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Prompt input must track the prompt label; catppuccin's align=centre splits them.
# Solid bg/fill: tmux draws the prompt over the status line, and bg=default cells
# let the window tabs underneath show through after the prompt text.
set -gF message-style "fg=#{@thm_teal},bg=#{@thm_bg},fill=#{@thm_bg},align=left"
set -gF message-command-style "fg=#{@thm_teal},bg=#{@thm_bg},fill=#{@thm_bg},align=left"

# --- Apply correct theme on startup based on current system appearance ---
# dark-notify only fires on *changes*, not on initial launch
run-shell 'if defaults read -g AppleInterfaceStyle 2>/dev/null | grep -qi dark; then ~/.config/tmux/set-theme-mode.sh dark; else ~/.config/tmux/set-theme-mode.sh light; fi'
run-shell '~/.config/tmux/dark-notify-runner.sh >/dev/null 2>&1 &'

# --- Other Plugin Options ---
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="    " --border-label=" Open URL "'
set -g @continuum-restore 'on'
